name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm agent-native:doctor

  tribunal-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python harness rules == TypeScript app rules (300 fixtures)
        run: cd experiments && python tribunal.py --check
      - name: Recompute the published summaries from the raw logs
        run: |
          pip install scipy==1.15.1
          cd experiments
          python analyze.py --out /tmp/summary.json > /dev/null
          python analyze_h2.py --out /tmp/summary_h2.json > /dev/null
          python - <<'PY'
          import json
          for fresh, published in [("/tmp/summary.json", "results/summary.json"),
                                   ("/tmp/summary_h2.json", "results_h2/summary_h2.json")]:
              assert json.load(open(fresh)) == json.load(open(published)), published + " does not match a fresh analysis"
          print("summaries reproduced")
          PY
