name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm agent-native:doctor

  tribunal-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python harness rules == TypeScript app rules (300 fixtures)
        run: cd experiments && python tribunal.py --check
      - name: Recompute the published summary from the raw logs
        run: |
          pip install scipy==1.15.1
          cd experiments && python analyze.py --out /tmp/summary.json > /dev/null
          python - <<'PY'
          import json
          a = json.load(open("/tmp/summary.json")); b = json.load(open("experiments/results/summary.json"))
          assert a == b, "results/summary.json does not match a fresh analysis of the logs"
          print("summary reproduced")
          PY
